global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'product-service'
    static_configs:
      - targets: ['product-service:8001']

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8002']

  - job_name: 'refund-service'
    static_configs:
      - targets: ['refund-service:8003']

  - job_name: 'ticket-service'
    static_configs:
      - targets: ['ticket-service:8004']

  - job_name: 'embedding-service'
    static_configs:
      - targets: ['embedding-service:8005']

  - job_name: 'rag-service'
    static_configs:
      - targets: ['rag-service:8006']

  - job_name: 'ai-orchestrator'
    static_configs:
      - targets: ['ai-orchestrator:8007']

  - job_name: 'chat-service'
    static_configs:
      - targets: ['chat-service:8008']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8009']
