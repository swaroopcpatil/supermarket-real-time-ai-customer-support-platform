[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["tests", "services/shared_platform/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI focused on correctness checks and prevent new Ruff rule families from
# failing existing application code when the tool is upgraded.
select = ["E4", "E7", "E9", "F"]
