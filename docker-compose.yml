services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supermarket-postgres
    environment:
      POSTGRES_USER: supermarket
      POSTGRES_PASSWORD: supermarket
      POSTGRES_DB: supermarket
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./infrastructure/postgres/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermarket -d supermarket"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supermarket-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: supermarket-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: supermarket-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: supermarket-api-gateway
    ports:
      - "8000:8000"
    environment:
      - AI_PROVIDER=mock
      - DATABASE_URL=postgresql+asyncpg://supermarket:supermarket@postgres:5432/supermarket
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: supermarket-product-service
    ports:
      - "8001:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: supermarket-order-service
    ports:
      - "8002:8002"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  refund-service:
    build:
      context: .
      dockerfile: services/refund-service/Dockerfile
    container_name: supermarket-refund-service
    ports:
      - "8003:8003"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  ticket-service:
    build:
      context: .
      dockerfile: services/ticket-service/Dockerfile
    container_name: supermarket-ticket-service
    ports:
      - "8004:8004"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  embedding-service:
    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
    container_name: supermarket-embedding-service
    ports:
      - "8005:8005"

  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    container_name: supermarket-rag-service
    ports:
      - "8006:8006"

  ai-orchestrator:
    build:
      context: .
      dockerfile: services/ai-orchestrator/Dockerfile
    container_name: supermarket-ai-orchestrator
    ports:
      - "8007:8007"
    environment:
      - AI_PROVIDER=mock

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    container_name: supermarket-chat-service
    ports:
      - "8008:8008"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: supermarket-notification-service
    ports:
      - "8009:8009"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: supermarket-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - API_GATEWAY_INTERNAL_URL=http://api-gateway:8000
    depends_on:
      - api-gateway

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: supermarket-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.1.0
    container_name: supermarket-grafana
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"

volumes:
  postgres_data:
